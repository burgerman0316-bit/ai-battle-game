<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apex Mobile Web Engine</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050508;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }
        .joystick-container {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(0, 255, 200, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            touch-action: none;
        }
        .joystick-knob {
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #00ffc8 0%, #008baa 100%);
            border-radius: 50%;
            box-shadow: 0 0 15px #00ffc8;
            transform: translate(0px, 0px);
            transition: transform 0.05s ease-out;
        }
        .action-button {
            position: absolute;
            bottom: 50px;
            right: 40px;
            width: 90px;
            height: 90px;
            background: rgba(255, 0, 85, 0.1);
            border: 2px solid rgba(255, 0, 85, 0.4);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff0055;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
            pointer-events: auto;
            touch-action: none;
        }
        .action-button:active {
            background: rgba(255, 0, 85, 0.4);
            box-shadow: 0 0 25px #ff0055;
            color: #fff;
        }
        #perf-monitor {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #00ffc8;
            font-family: monospace;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.7);
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid rgba(0, 255, 200, 0.3);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div id="perf-monitor">FPS: -- | DC: -- | ENEMIES: --</div>
        <div class="joystick-container" id="joystick">
            <div class="joystick-knob" id="knob"></div>
        </div>
        <div class="action-button" id="fire-btn">FIRE</div>
    </div>

    <script>
        // --- CORE GAME CONFIGURATION ---
        const CONFIG = {
            playerSpeed: 9.0,
            turnSpeed: 2.8,
            playerRadius: 0.5,
            arenaSize: 60,
            maxProjectiles: 30,
            projectileSpeed: 40.0,
            fireRate: 0.15,
            maxEnemies: 8,
            enemySpeed: 3.5,
            enemyRadius: 0.6
        };

        let scene, camera, renderer;
        let player;
        let lastTime = performance.now();
        let frameCount = 0;
        let fpsTimer = 0;
        let audioCtx = null;

        // Optimized Vector Caches
        const inputVector = { x: 0, y: 0 };
        let moveVector, tempObject3D;
        
        let isFiringRequested = false;
        let fireCooldownTimer = 0;

        // --- COLLISION MAP DATA STORAGE ---
        const staticWalls = []; // Contains simple raw bounds for quick CPU iterations

        // --- INSTANCED SYSTEM CORES ---
        let projectileMesh;
        const projectileData = [];
        let projectileNextIndex = 0;

        let enemyMesh;
        const enemyData = [];
        let activeEnemyCount = 0;

        // --- INITIALIZATION ---
        function init() {
            if (typeof THREE === 'undefined') {
                document.getElementById('perf-monitor').innerText = "ERROR: CDN LOADING FAILED";
                return;
            }

            moveVector = new THREE.Vector3();
            tempObject3D = new THREE.Object3D();

            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x040408);
            scene.fog = new THREE.FogExp2(0x040408, 0.03);

            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            container.appendChild(renderer.domElement);

            setupLights();
            createEnvironment();
            createPlayer();
            setupProjectilePool();
            setupEnemySystem();
            setupMobileInputs();

            window.addEventListener('resize', onWindowResize, false);
            requestAnimationFrame(animate);
        }

        function initAudio() {
            if (audioCtx === null) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playLaserSound(pitch = 750) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(pitch, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.09);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.09);
            } catch(e){}
        }

        function setupLights() {
            scene.add(new THREE.AmbientLight(0x161628, 1.5));
            const light = new THREE.DirectionalLight(0x00ffc8, 2.0);
            light.position.set(20, 40, 20);
            scene.add(light);
        }

        function createPlayer() {
            player = new THREE.Group();
            player.position.set(0, 0.5, 0); // Ground aligned

            const geometry = new THREE.ConeGeometry(0.5, 1.6, 4);
            const material = new THREE.MeshStandardMaterial({
                color: 0x00ffc8,
                emissive: 0x00ffc8,
                emissiveIntensity: 0.5,
                metalness: 0.8, roughness: 0.2
            });

            const mesh = new THREE.Mesh(geometry, material);
            mesh.rotation.x = Math.PI / 2;
            player.add(mesh);
            scene.add(player);

            camera.position.set(0, 7, -10);
            camera.lookAt(new THREE.Vector3(0, 0.5, 3));
            player.add(camera);
        }

        function createEnvironment() {
            // Floor
            const floorGeo = new THREE.PlaneGeometry(CONFIG.arenaSize, CONFIG.arenaSize);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x0d0d14, roughness: 0.6 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const grid = new THREE.GridHelper(CONFIG.arenaSize, 30, 0x00ffc8, 0x1d1d2b);
            grid.position.y = 0.01;
            scene.add(grid);

            // Clean, Structured Tactical Map Design (No chaotic messy overlap strings)
            const wallWidth = 4.0;
            const wallLength = 12.0;
            const wallHeight = 4.0;
            const boxGeo = new THREE.BoxGeometry(wallWidth, wallHeight, wallLength);
            const boxMat = new THREE.MeshStandardMaterial({ color: 0x1a1a26, roughness: 0.4, metalness: 0.5 });

            // Define clean, non-overlapping architectural coordinates layout
            const structuralLayouts = [
                {x: -15, z: 15}, {x: 15, z: 15},
                {x: -15, z: -15}, {x: 15, z: -15},
                {x: 0, z: 22}, {x: 0, z: -22},
                {x: -22, z: 0}, {x: 22, z: 0}
            ];

            const instancedWalls = new THREE.InstancedMesh(boxGeo, boxMat, structuralLayouts.length);
            const dummy = new THREE.Object3D();

            for (let i = 0; i < structuralLayouts.length; i++) {
                const pos = structuralLayouts[i];
                const rotateMap = i % 2 === 0 ? 0 : Math.PI / 2;

                dummy.position.set(pos.x, wallHeight / 2, pos.z);
                dummy.rotation.y = rotateMap;
                dummy.updateMatrix();
                instancedWalls.setMatrixAt(i, dummy.matrix);

                // Compute explicit structural sizing for calculations
                const isRotated = rotateMap !== 0;
                staticWalls.push({
                    minX: pos.x - (isRotated ? wallLength : wallWidth) / 2,
                    maxX: pos.x + (isRotated ? wallLength : wallWidth) / 2,
                    minZ: pos.z - (isRotated ? wallWidth : wallLength) / 2,
                    maxZ: pos.z + (isRotated ? wallWidth : wallLength) / 2
                });
            }
            scene.add(instancedWalls);
        }

        function setupProjectilePool() {
            const pGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.7, 4);
            const pMat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
            projectileMesh = new THREE.InstancedMesh(pGeo, pMat, CONFIG.maxProjectiles);
            
            for (let i = 0; i < CONFIG.maxProjectiles; i++) {
                projectileData.push({ active: false, position: new THREE.Vector3(), direction: new THREE.Vector3(), life: 0 });
                tempObject3D.position.set(0, -500, 0);
                tempObject3D.updateMatrix();
                projectileMesh.setMatrixAt(i, tempObject3D.matrix);
            }
            scene.add(projectileMesh);
        }

        function setupEnemySystem() {
            // High visibility red enemy pyramids
            const eGeo = new THREE.ConeGeometry(CONFIG.enemyRadius, 1.4, 4);
            const eMat = new THREE.MeshStandardMaterial({ 
                color: 0xff3300, emissive: 0xff1100, emissiveIntensity: 0.6, metalness: 0.7 
            });
            enemyMesh = new THREE.InstancedMesh(eGeo, eMat, CONFIG.maxEnemies);

            for (let i = 0; i < CONFIG.maxEnemies; i++) {
                enemyData.push({
                    active: false,
                    position: new THREE.Vector3(),
                    health: 2
                });
                tempObject3D.position.set(0, -500, 0);
                tempObject3D.updateMatrix();
                enemyMesh.setMatrixAt(i, tempObject3D.matrix);
            }
            scene.add(enemyMesh);
            
            // Spawn initial wave
            for(let i=0; i<CONFIG.maxEnemies; i++) { spawnEnemy(); }
        }

        function spawnEnemy() {
            for (let i = 0; i < CONFIG.maxEnemies; i++) {
                if (!enemyData[i].active) {
                    const ed = enemyData[i];
                    ed.active = true;
                    ed.health = 2;
                    
                    // Spawn out randomly in margins
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 18 + Math.random() * 10;
                    ed.position.set(
                        player.position.x + Math.cos(angle) * dist,
                        0.5,
                        player.position.z + Math.sin(angle) * dist
                    );
                    activeEnemyCount++;
                    break;
                }
            }
        }

        // --- MATH COLLISION PIPELINES (Zero Engine Allocations) ---
        function checkWallCollision(posX, posZ, radius) {
            const out = { x: posX, z: posZ, collided: false };
            
            for (let i = 0; i < staticWalls.length; i++) {
                const wall = staticWalls[i];
                
                // Find closest point inside box boundary coordinates
                const closestX = Math.max(wall.minX, Math.min(posX, wall.maxX));
                const closestZ = Math.max(wall.minZ, Math.min(posZ, wall.maxZ));
                
                const distX = posX - closestX;
                const distZ = posZ - closestZ;
                const distanceSq = (distX * distX) + (distZ * distZ);
                
                if (distanceSq < radius * radius) {
                    out.collided = true;
                    const distance = Math.sqrt(distanceSq);
                    if (distance === 0) continue;
                    
                    // Shift object safely back outside the geometric normal boundary edge
                    const overlap = radius - distance;
                    out.x += (distX / distance) * overlap;
                    out.z += (distZ / distance) * overlap;
                    posX = out.x;
                    posZ = out.z;
                }
            }
            return out;
        }

        function fireWeapon() {
            initAudio();
            playLaserSound(800);

            const p = projectileData[projectileNextIndex];
            p.active = true;
            p.life = 1.2;
            p.position.copy(player.position).add(new THREE.Vector3(0, 0.2, 0));
            p.direction.set(0, 0, 1).applyQuaternion(player.quaternion).normalize();

            projectileNextIndex = (projectileNextIndex + 1) % CONFIG.maxProjectiles;
        }

        // --- INPUT ROUTINES ---
        function setupMobileInputs() {
            const joystick = document.getElementById('joystick');
            const knob = document.getElementById('knob');
            const fireBtn = document.getElementById('fire-btn');
            const maxRadius = 50;
            let touchId = null; let startX = 0; let startY = 0;

            joystick.addEventListener('touchstart', (e) => {
                if (touchId !== null) return;
                const touch = e.changedTouches[0];
                touchId = touch.identifier;
                const rect = joystick.getBoundingClientRect();
                startX = rect.left + rect.width / 2; startY = rect.top + rect.height / 2;
                initAudio();
            }, { passive: true });

            window.addEventListener('touchmove', (e) => {
                if (touchId === null) return;
                let t = null;
                for (let i = 0; i < e.touches.length; i++) { if (e.touches[i].identifier === touchId) { t = e.touches[i]; break; } }
                if (t) {
                    let dx = t.clientX - startX; let dy = t.clientY - startY;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance > maxRadius) { dx = (dx / distance) * maxRadius; dy = (dy / distance) * maxRadius; }
                    knob.style.transform = `translate(${dx}px, ${dy}px)`;
                    inputVector.x = dx / maxRadius; inputVector.y = -dy / maxRadius;
                }
            }, { passive: true });

            const endTouch = (e) => {
                if (touchId === null) return;
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === touchId) {
                        touchId = null; knob.style.transform = 'translate(0px, 0px)';
                        inputVector.x = 0; inputVector.y = 0; break;
                    }
                }
            };
            window.addEventListener('touchend', endTouch, { passive: true });
            window.addEventListener('touchcancel', endTouch, { passive: true });
            
            fireBtn.addEventListener('touchstart', (e) => { isFiringRequested = true; initAudio(); }, { passive: true });
            fireBtn.addEventListener('touchend', () => { isFiringRequested = false; }, { passive: true });

            window.addEventListener('keydown', (e) => {
                if(e.key === 'w' || e.key === 'ArrowUp') inputVector.y = 1;
                if(e.key === 's' || e.key === 'ArrowDown') inputVector.y = -1;
                if(e.key === 'a' || e.key === 'ArrowLeft') inputVector.x = -1;
                if(e.key === 'd' || e.key === 'ArrowRight') inputVector.x = 1;
                if(e.key === ' ') { isFiringRequested = true; initAudio(); }
            });
            window.addEventListener('keyup', (e) => {
                if(['w', 's', 'ArrowUp', 'ArrowDown'].includes(e.key)) inputVector.y = 0;
                if(['a', 'd', 'ArrowLeft', 'ArrowRight'].includes(e.key)) inputVector.x = 0;
                if(e.key === ' ') isFiringRequested = false;
            });
        }

        function onWindowResize() {
            if(!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- SYSTEM ENGINE RENDERING LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();
            const deltaTime = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;

            // 1. Player Physics & Wall Collision Corrections
            if (inputVector.x !== 0 || inputVector.y !== 0) {
                player.rotation.y -= inputVector.x * CONFIG.turnSpeed * deltaTime;
                moveVector.set(0, 0, inputVector.y).applyQuaternion(player.quaternion);
                
                // Estimate target steps
                let nextX = player.position.x + moveVector.x * CONFIG.playerSpeed * deltaTime;
                let nextZ = player.position.z + moveVector.z * CONFIG.playerSpeed * deltaTime;

                // Enforce calculated geometric boundary walls limits
                const checkedPos = checkWallCollision(nextX, nextZ, CONFIG.playerRadius);
                
                // Lock inside map perimeter edge bounds
                const halfBounds = CONFIG.arenaSize / 2 - 1;
                player.position.x = Math.max(-halfBounds, Math.min(halfBounds, checkedPos.x));
                player.position.z = Math.max(-halfBounds, Math.min(halfBounds, checkedPos.z));
            }

            // 2. Weapon Processing Core
            if (fireCooldownTimer > 0) fireCooldownTimer -= deltaTime;
            if (isFiringRequested && fireCooldownTimer <= 0) {
                fireWeapon();
                fireCooldownTimer = CONFIG.fireRate;
            }

            // 3. Drone Enemy Intelligence Trajectory Updates
            let enemyMatrixUpdate = false;
            for (let i = 0; i < CONFIG.maxEnemies; i++) {
                const ed = enemyData[i];
                if (ed.active) {
                    // Compute basic target heading vector difference tracking steps
                    const dirX = player.position.x - ed.position.x;
                    const dirZ = player.position.z - ed.position.z;
                    const distance = Math.sqrt(dirX * dirX + dirZ * dirZ);

                    if (distance > 0.1) {
                        let stepX = ed.position.x + (dirX / distance) * CONFIG.enemySpeed * deltaTime;
                        let stepZ = ed.position.z + (dirZ / distance) * CONFIG.enemySpeed * deltaTime;

                        // Slide enemies smoothly around tactical architectural obstacles
                        const correctedEnemy = checkWallCollision(stepX, stepZ, CONFIG.enemyRadius);
                        ed.position.x = correctedEnemy.x;
                        ed.position.z = correctedEnemy.z;
                    }

                    tempObject3D.position.copy(ed.position);
                    tempObject3D.lookAt(player.position.x, ed.position.y, player.position.z);
                    tempObject3D.rotateX(Math.PI / 2); // Rotate Cone to point at player
                    tempObject3D.updateMatrix();
                    enemyMesh.setMatrixAt(i, tempObject3D.matrix);
                    enemyMatrixUpdate = true;
                }
            }
            if (enemyMatrixUpdate) enemyMesh.instanceMatrix.needsUpdate = true;

            // 4. Bullet Tracking + Combat Damage Raycasting Metrics
            let bulletMatrixUpdate = false;
            for (let i = 0; i < CONFIG.maxProjectiles; i++) {
                const p = projectileData[i];
                if (p.active) {
                    p.life -= deltaTime;
                    if (p.life <= 0) {
                        p.active = false;
                        tempObject3D.position.set(0, -500, 0);
                    } else {
                        p.position.addScaledVector(p.direction, CONFIG.projectileSpeed * deltaTime);
                        
                        // Check structural wall bounds impact culls
                        const hitWall = checkWallCollision(p.position.x, p.position.z, 0.1);
                        if (hitWall.collided) {
                            p.active = false;
                            tempObject3D.position.set(0, -500, 0);
                        } else {
                            tempObject3D.position.copy(p.position);
                            tempObject3D.lookAt(p.position.clone().add(p.direction));
                            tempObject3D.rotateX(Math.PI / 2);

                            // Combat Raycast: Distance calculation verification check versus active bots
                            for (let e = 0; e < CONFIG.maxEnemies; e++) {
                                const ed = enemyData[e];
                                if (ed.active) {
                                    const ex = p.position.x - ed.position.x;
                                    const ez = p.position.z - ed.position.z;
                                    const hitDistSq = (ex * ex) + (ez * ez);

                                    if (hitDistSq < (CONFIG.enemyRadius * CONFIG.enemyRadius)) {
                                        p.active = false;
                                        tempObject3D.position.set(0, -500, 0);
                                        ed.health--;
                                        playLaserSound(300); // Low crunch impact hit sound

                                        if (ed.health <= 0) {
                                            ed.active = false;
                                            activeEnemyCount--;
                                            // Auto-respawn to keep player in loop
                                            setTimeout(spawnEnemy, 2000); 
                                        }
                                        break;
                                    }
                                }
                            }
                        }
                    }
                    tempObject3D.updateMatrix();
                    projectileMesh.setMatrixAt(i, tempObject3D.matrix);
                    bulletMatrixUpdate = true;
                }
            }
            if (bulletMatrixUpdate) projectileMesh.instanceMatrix.needsUpdate = true;

            // 5. Draw
            renderer.render(scene, camera);

            // 6. Diagnostics Diagnostics Display updates
            frameCount++;
            fpsTimer += deltaTime;
            if (fpsTimer >= 1.0) {
                document.getElementById('perf-monitor').innerText = 
                    `FPS: ${frameCount} | DC: ${renderer.info.render.calls} | ACTIVE ENEMIES: ${activeEnemyCount}`;
                frameCount = 0; fpsTimer = 0;
            }
        }

        init();
    </script>
</body>
</html>
