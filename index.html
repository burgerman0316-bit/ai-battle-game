<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apex Mobile Web Engine</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050508;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }
        .joystick-container {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(0, 255, 200, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            touch-action: none;
        }
        .joystick-knob {
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #00ffc8 0%, #008baa 100%);
            border-radius: 50%;
            box-shadow: 0 0 15px #00ffc8;
            transform: translate(0px, 0px);
            transition: transform 0.05s ease-out;
        }
        .action-button {
            position: absolute;
            bottom: 50px;
            right: 40px;
            width: 90px;
            height: 90px;
            background: rgba(255, 0, 85, 0.1);
            border: 2px solid rgba(255, 0, 85, 0.4);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff0055;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
            pointer-events: auto;
            touch-action: none;
        }
        .action-button:active {
            background: rgba(255, 0, 85, 0.4);
            box-shadow: 0 0 25px #ff0055;
            color: #fff;
        }
        #perf-monitor {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #00ffc8;
            font-family: monospace;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.7);
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid rgba(0, 255, 200, 0.3);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div id="perf-monitor">FPS: -- | DC: --</div>
        <div class="joystick-container" id="joystick">
            <div class="joystick-knob" id="knob"></div>
        </div>
        <div class="action-button" id="fire-btn">FIRE</div>
    </div>

    <script>
        // --- CONFIG & CONFIGURATION ---
        const CONFIG = {
            playerSpeed: 8.0,
            turnSpeed: 2.5,
            arenaSize: 50,
            maxProjectiles: 30,
            projectileSpeed: 35.0,
            fireRate: 0.18 // Delay in seconds between shots
        };

        let scene, camera, renderer;
        let player, environmentMesh;
        let lastTime = performance.now();
        let frameCount = 0;
        let fpsTimer = 0;

        // Audio Context (Lazy initialized on first interactive input)
        let audioCtx = null;

        // Input Storage Structures
        const inputVector = { x: 0, y: 0 };
        const moveVector = new THREE.Vector3();
        let isFiringRequested = false;
        let fireCooldownTimer = 0;

        // --- INSTANCED HIGH-PERFORMANCE POOL DATA STRUCTURES ---
        let projectileMesh;
        const projectileData = []; // Array of tracking properties
        let projectileNextIndex = 0;

        // Setup matrix manipulation placeholders to prevent runtime GC allocations
        const tempObject3D = new THREE.Object3D();

        // --- INITIALIZATION ---
        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050508);
            scene.fog = new THREE.FogExp2(0x050508, 0.035);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            container.appendChild(renderer.domElement);

            createEnvironment();
            createPlayer();
            setupLights();
            setupProjectilePool();

            setupMobileInputs();

            window.addEventListener('resize', onWindowResize, false);

            requestAnimationFrame(animate);
        }

        // --- AUDIO ENGINE SYNTHESIS (Zero Assets/No Network Dependency) ---
        function initAudio() {
            if (audioCtx === null) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playLaserSound() {
            if (!audioCtx) return;
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sawtooth';
            // Fast frequency slide down for that high-tech heavy impact crackle
            osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.12);
            
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        // --- GRAPHICS & WORLD CREATION ---
        function setupLights() {
            const ambientLight = new THREE.AmbientLight(0x0a0a15);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0x00ffc8, 1.5);
            directionalLight.position.set(10, 20, 10);
            scene.add(directionalLight);
        }

        function createPlayer() {
            player = new THREE.Group();
            player.position.set(0, 1, 0);

            // High-Contrast glowing player mesh
            const geometry = new THREE.CylinderGeometry(0, 0.6, 2, 4);
            const material = new THREE.MeshStandardMaterial({
                color: 0x00ffc8,
                roughness: 0.2,
                metalness: 0.8,
                emissive: 0x00ffc8,
                emissiveIntensity: 0.3
            });

            const mesh = new THREE.Mesh(geometry, material);
            mesh.rotation.x = Math.PI / 2;
            player.add(mesh);
            scene.add(player);

            camera.position.set(0, 5, -8);
            camera.lookAt(new THREE.Vector3(0, 1, 4));
            player.add(camera);
        }

        function createEnvironment() {
            const floorGeo = new THREE.PlaneGeometry(CONFIG.arenaSize, CONFIG.arenaSize, 10, 10);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x101018, roughness: 0.4, metalness: 0.7 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const grid = new THREE.GridHelper(CONFIG.arenaSize, 50, 0x00ffc8, 0x222233);
            grid.position.y = 0.01;
            scene.add(grid);

            const boxGeo = new THREE.BoxGeometry(2, 4, 2);
            const boxMat = new THREE.MeshStandardMaterial({ color: 0x1a1a26, roughness: 0.5, metalness: 0.5 });
            
            const instanceCount = 40;
            const instancedObstacles = new THREE.InstancedMesh(boxGeo, boxMat, instanceCount);
            const dummy = new THREE.Object3D();

            for (let i = 0; i < instanceCount; i++) {
                let rx = (Math.random() - 0.5) * (CONFIG.arenaSize - 10);
                let rz = (Math.random() - 0.5) * (CONFIG.arenaSize - 10);
                
                if(Math.abs(rx) < 5) rx += 10;
                if(Math.abs(rz) < 5) rz += 10;

                dummy.position.set(rx, 2, rz);
                dummy.updateMatrix();
                instancedObstacles.setMatrixAt(i, dummy.matrix);
            }
            scene.add(instancedObstacles);
        }

        // --- ARRAYS & MEMORY MANAGEMENT SETUP ---
        function setupProjectilePool() {
            // Raw capsule configuration representing glowing plasma bolt ammunition
            const pGeo = new THREE.CapsuleGeometry(0.08, 0.6, 2, 4);
            const pMat = new THREE.MeshBasicMaterial({
                color: 0xff0055,
            });

            // Single Instanced Mesh handles ALL concurrent project lasers on 1 draw call
            projectileMesh = new THREE.InstancedMesh(pGeo, pMat, CONFIG.maxProjectiles);
            
            // Populate tracking array buffer
            for (let i = 0; i < CONFIG.maxProjectiles; i++) {
                projectileData.push({
                    active: false,
                    position: new THREE.Vector3(),
                    direction: new THREE.Vector3(),
                    life: 0.0
                });

                // Move instance representation far below visible boundaries
                tempObject3D.position.set(0, -1000, 0);
                tempObject3D.updateMatrix();
                projectileMesh.setMatrixAt(i, tempObject3D.matrix);
            }
            
            projectileMesh.instanceMatrix.needsUpdate = true;
            scene.add(projectileMesh);
        }

        // --- ENGINE REACTION TRIGGER CORES ---
        function fireWeapon() {
            initAudio();
            playLaserSound();

            const p = projectileData[projectileNextIndex];
            p.active = true;
            p.life = 1.5; // Seconds alive before auto pooling culls it
            
            // Pull tracking vectors from weapon origin points safely
            p.position.copy(player.position).add(new THREE.Vector3(0, 0.4, 0));
            
            // Get direction vector based on the player mesh heading rotation rotation
            p.direction.set(0, 0, 1).applyQuaternion(player.quaternion).normalize();

            projectileNextIndex = (projectileNextIndex + 1) % CONFIG.maxProjectiles;
        }

        // --- HIGH-PERFORMANCE INTERACTION CONTROL ---
        function setupMobileInputs() {
            const joystick = document.getElementById('joystick');
            const knob = document.getElementById('knob');
            const fireBtn = document.getElementById('fire-btn');
            const maxRadius = 50;

            let touchId = null;
            let startX = 0;
            let startY = 0;

            // Joystick Management
            joystick.addEventListener('touchstart', (e) => {
                if (touchId !== null) return; 
                const touch = e.changedTouches[0];
                touchId = touch.identifier;
                const rect = joystick.getBoundingClientRect();
                startX = rect.left + rect.width / 2;
                startY = rect.top + rect.height / 2;
                initAudio();
            }, { passive: true });

            window.addEventListener('touchmove', (e) => {
                if (touchId === null) return;
                
                let targetTouch = null;
                for (let i = 0; i < e.touches.length; i++) {
                    if (e.touches[i].identifier === touchId) {
                        targetTouch = e.touches[i];
                        break;
                    }
                }

                if (targetTouch) {
                    let dx = targetTouch.clientX - startX;
                    let dy = targetTouch.clientY - startY;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance > maxRadius) {
                        dx = (dx / distance) * maxRadius;
                        dy = (dy / distance) * maxRadius;
                        distance = maxRadius;
                    }

                    knob.style.transform = `translate(${dx}px, ${dy}px)`;
                    inputVector.x = dx / maxRadius;
                    inputVector.y = -dy / maxRadius;
                }
            }, { passive: true });

            const endTouch = (e) => {
                if (touchId === null) return;
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === touchId) {
                        touchId = null;
                        knob.style.transform = 'translate(0px, 0px)';
                        inputVector.x = 0;
                        inputVector.y = 0;
                        break;
                    }
                }
            };

            window.addEventListener('touchend', endTouch, { passive: true });
            window.addEventListener('touchcancel', endTouch, { passive: true });
            
            // Firing Trigger Event Handlers
            fireBtn.addEventListener('touchstart', (e) => {
                isFiringRequested = true;
                initAudio();
            }, { passive: true });

            fireBtn.addEventListener('touchend', () => { isFiringRequested = false; }, { passive: true });

            // Keyboard Spacebar Fallback Setup
            window.addEventListener('keydown', (e) => {
                if(e.key === 'w' || e.key === 'ArrowUp') inputVector.y = 1;
                if(e.key === 's' || e.key === 'ArrowDown') inputVector.y = -1;
                if(e.key === 'a' || e.key === 'ArrowLeft') inputVector.x = -1;
                if(e.key === 'd' || e.key === 'ArrowRight') inputVector.x = 1;
                if(e.key === ' ') { isFiringRequested = true; initAudio(); }
            });
            window.addEventListener('keyup', (e) => {
                if(['w', 's', 'ArrowUp', 'ArrowDown'].includes(e.key)) inputVector.y = 0;
                if(['a', 'd', 'ArrowLeft', 'ArrowRight'].includes(e.key)) inputVector.x = 0;
                if(e.key === ' ') isFiringRequested = false;
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- CORE PROCESS EXECUTION MATRIX TICKER ---
        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();
            const deltaTime = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;

            // 1. Process Core Player Handling Metrics
            if (inputVector.x !== 0 || inputVector.y !== 0) {
                player.rotation.y -= inputVector.x * CONFIG.turnSpeed * deltaTime;
                moveVector.set(0, 0, inputVector.y);
                moveVector.applyQuaternion(player.quaternion);
                player.position.addScaledVector(moveVector, CONFIG.playerSpeed * deltaTime);

                const halfArena = CONFIG.arenaSize / 2;
                player.position.x = Math.max(-halfArena, Math.min(halfArena, player.position.x));
                player.position.z = Math.max(-halfArena, Math.min(halfArena, player.position.z));
            }

            // 2. Weapon Cooldown Processing Matrix
            if (fireCooldownTimer > 0) {
                fireCooldownTimer -= deltaTime;
            }
            if (isFiringRequested && fireCooldownTimer <= 0) {
                fireWeapon();
                fireCooldownTimer = CONFIG.fireRate;
            }

            // 3. Process & Translate Array Projectiles Array Buffer
            let matrixNeedsUpdate = false;
            for (let i = 0; i < CONFIG.maxProjectiles; i++) {
                const p = projectileData[i];
                if (p.active) {
                    p.life -= deltaTime;
                    if (p.life <= 0) {
                        p.active = false;
                        tempObject3D.position.set(0, -1000, 0); // Hide below ground
                    } else {
                        // Forward trajectory updating logic
                        p.position.addScaledVector(p.direction, CONFIG.projectileSpeed * deltaTime);
                        tempObject3D.position.copy(p.position);
                        
                        // Rotate geometry into its direction path vector
                        tempObject3D.lookAt(p.position.clone().add(p.direction));
                        tempObject3D.rotateX(Math.PI / 2);
                    }
                    tempObject3D.updateMatrix();
                    projectileMesh.setMatrixAt(i, tempObject3D.matrix);
                    matrixNeedsUpdate = true;
                }
            }
            if (matrixNeedsUpdate) {
                projectileMesh.instanceMatrix.needsUpdate = true;
            }

            // 4. Render Execution
            renderer.render(scene, camera);

            // 5. Profiling Metrics
            frameCount++;
            fpsTimer += deltaTime;
            if (fpsTimer >= 1.0) {
                document.getElementById('perf-monitor').innerText = 
                    `FPS: ${frameCount} | DC: ${renderer.info.render.calls}`;
                frameCount = 0;
                fpsTimer = 0;
            }
        }

        window.onload = init;
    </script>
</body>
</html>
