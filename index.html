<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apex Mobile Web Engine</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050508;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }
        .joystick-container {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(0, 255, 200, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            touch-action: none;
        }
        .joystick-knob {
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #00ffc8 0%, #008baa 100%);
            border-radius: 50%;
            box-shadow: 0 0 15px #00ffc8;
            transform: translate(0px, 0px);
            transition: transform 0.05s ease-out;
        }
        .action-button {
            position: absolute;
            bottom: 50px;
            right: 40px;
            width: 90px;
            height: 90px;
            background: rgba(255, 0, 85, 0.1);
            border: 2px solid rgba(255, 0, 85, 0.4);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff0055;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
            pointer-events: auto;
            touch-action: none;
        }
        .action-button:active {
            background: rgba(255, 0, 85, 0.4);
            box-shadow: 0 0 25px #ff0055;
            color: #fff;
        }
        #perf-monitor {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #00ffc8;
            font-family: monospace;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.7);
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid rgba(0, 255, 200, 0.3);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div id="perf-monitor">FPS: -- | DC: --</div>
        <div class="joystick-container" id="joystick">
            <div class="joystick-knob" id="knob"></div>
        </div>
        <div class="action-button" id="fire-btn">FIRE</div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const CONFIG = {
            playerSpeed: 8.0,
            turnSpeed: 2.5,
            arenaSize: 50,
            maxProjectiles: 30,
            projectileSpeed: 35.0,
            fireRate: 0.18
        };

        // Engine Handles
        let scene, camera, renderer;
        let player;
        let lastTime = performance.now();
        let frameCount = 0;
        let fpsTimer = 0;
        let audioCtx = null;

        // Lazy-instantiated engine structs (allocated safely inside init to avoid racing the CDN)
        const inputVector = { x: 0, y: 0 };
        let moveVector;
        let tempObject3D;
        
        let isFiringRequested = false;
        let fireCooldownTimer = 0;

        // Projectile Pool Structures
        let projectileMesh;
        const projectileData = [];
        let projectileNextIndex = 0;

        // --- ENGINE INITIALIZATION ---
        function init() {
            // Confirm Three.js loaded correctly before initialization attempts
            if (typeof THREE === 'undefined') {
                document.getElementById('perf-monitor').innerText = "ERROR: THREE.JS CDN BLOCKED OR LAGGING";
                return;
            }

            // Safe Internal Structural Allocations
            moveVector = new THREE.Vector3();
            tempObject3D = new THREE.Object3D();

            const container = document.getElementById('canvas-container');

            // 1. Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a12);
            scene.fog = new THREE.FogExp2(0x0a0a12, 0.03);

            // 2. Camera Setup
            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            // 3. WebGL Renderer Tuning
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            container.appendChild(renderer.domElement);

            // 4. Build Systems
            setupLights();
            createEnvironment();
            createPlayer();
            setupProjectilePool();
            setupMobileInputs();

            // 5. Global Window Handlers
            window.addEventListener('resize', onWindowResize, false);

            // Fire engine rendering process
            requestAnimationFrame(animate);
        }

        // --- AUDIO GENERATION ---
        function initAudio() {
            if (audioCtx === null) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playLaserSound() {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(750, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
                
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } catch(e) {
                console.log("Audio play blocked context");
            }
        }

        // --- LIGHTING & WORLD BUILDERS ---
        function setupLights() {
            // Amplified lights to counter dark mobile screens
            const ambientLight = new THREE.AmbientLight(0x1a1a30, 1.2);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0x00ffc8, 2.0);
            directionalLight.position.set(15, 30, 15);
            scene.add(directionalLight);

            const fillLight = new THREE.DirectionalLight(0xff0055, 0.8);
            fillLight.position.set(-15, 10, -15);
            scene.add(fillLight);
        }

        function createPlayer() {
            player = new THREE.Group();
            player.position.set(0, 1, 0);

            // Glowing neon stylized pyramid for the ship design
            const geometry = new THREE.ConeGeometry(0.6, 2, 4);
            const material = new THREE.MeshStandardMaterial({
                color: 0x00ffc8,
                roughness: 0.1,
                metalness: 0.9,
                emissive: 0x00ffc8,
                emissiveIntensity: 0.6
            });

            const mesh = new THREE.Mesh(geometry, material);
            mesh.rotation.x = Math.PI / 2; // Point forward along Z axis
            player.add(mesh);
            scene.add(player);

            // Rigid camera hierarchy setup
            camera.position.set(0, 6, -10);
            camera.lookAt(new THREE.Vector3(0, 1, 3));
            player.add(camera);
        }

        function createEnvironment() {
            // Floor Setup
            const floorGeo = new THREE.PlaneGeometry(CONFIG.arenaSize, CONFIG.arenaSize);
            const floorMat = new THREE.MeshStandardMaterial({ 
                color: 0x14141f, 
                roughness: 0.5, 
                metalness: 0.6 
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // Structural Neon Grid
            const grid = new THREE.GridHelper(CONFIG.arenaSize, 40, 0x00ffc8, 0x252538);
            grid.position.y = 0.02;
            scene.add(grid);

            // Obstacles
            const boxGeo = new THREE.BoxGeometry(25, 5, 2.5);
            const boxMat = new THREE.MeshStandardMaterial({ 
                color: 0x1d1d2b, 
                roughness: 0.4, 
                metalness: 0.6 
            });
            
            const instanceCount = 35;
            const instancedObstacles = new THREE.InstancedMesh(boxGeo, boxMat, instanceCount);
            const dummy = new THREE.Object3D();

            for (let i = 0; i < instanceCount; i++) {
                let rx = (Math.random() - 0.5) * (CONFIG.arenaSize - 12);
                let rz = (Math.random() - 0.5) * (CONFIG.arenaSize - 12);
                
                // Keep spawning zone completely clear
                if (Math.abs(rx) < 6) rx += 12;
                if (Math.abs(rz) < 6) rz += 12;

                dummy.position.set(rx, 1.25, rz);
                dummy.rotation.y = Math.random() * Math.PI;
                dummy.updateMatrix();
                instancedObstacles.setMatrixAt(i, dummy.matrix);
            }
            scene.add(instancedObstacles);
        }

        function setupProjectilePool() {
            const pGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.8, 4);
            const pMat = new THREE.MeshBasicMaterial({ color: 0xff0055 });

            projectileMesh = new THREE.InstancedMesh(pGeo, pMat, CONFIG.maxProjectiles);
            
            for (let i = 0; i < CONFIG.maxProjectiles; i++) {
                projectileData.push({
                    active: false,
                    position: new THREE.Vector3(),
                    direction: new THREE.Vector3(),
                    life: 0.0
                });

                tempObject3D.position.set(0, -500, 0);
                tempObject3D.updateMatrix();
                projectileMesh.setMatrixAt(i, tempObject3D.matrix);
            }
            
            projectileMesh.instanceMatrix.needsUpdate = true;
            scene.add(projectileMesh);
        }

        // --- ACTION CONTROLLERS ---
        function fireWeapon() {
            initAudio();
            playLaserSound();

            const p = projectileData[projectileNextIndex];
            p.active = true;
            p.life = 1.2;
            
            p.position.copy(player.position).add(new THREE.Vector3(0, 0.4, 0));
            p.direction.set(0, 0, 1).applyQuaternion(player.quaternion).normalize();

            projectileNextIndex = (projectileNextIndex + 1) % CONFIG.maxProjectiles;
        }

        // --- INTERACTIVE MOBILE TOUCH CONFIG ---
        function setupMobileInputs() {
            const joystick = document.getElementById('joystick');
            const knob = document.getElementById('knob');
            const fireBtn = document.getElementById('fire-btn');
            const maxRadius = 50;

            let touchId = null;
            let startX = 0;
            let startY = 0;

            joystick.addEventListener('touchstart', (e) => {
                if (touchId !== null) return; 
                const touch = e.changedTouches[0];
                touchId = touch.identifier;
                const rect = joystick.getBoundingClientRect();
                startX = rect.left + rect.width / 2;
                startY = rect.top + rect.height / 2;
                initAudio();
            }, { passive: true });

            window.addEventListener('touchmove', (e) => {
                if (touchId === null) return;
                
                let targetTouch = null;
                for (let i = 0; i < e.touches.length; i++) {
                    if (e.touches[i].identifier === touchId) {
                        targetTouch = e.touches[i];
                        break;
                    }
                }

                if (targetTouch) {
                    let dx = targetTouch.clientX - startX;
                    let dy = targetTouch.clientY - startY;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance > maxRadius) {
                        dx = (dx / distance) * maxRadius;
                        dy = (dy / distance) * maxRadius;
                        distance = maxRadius;
                    }

                    knob.style.transform = `translate(${dx}px, ${dy}px)`;
                    inputVector.x = dx / maxRadius;
                    inputVector.y = -dy / maxRadius;
                }
            }, { passive: true });

            const endTouch = (e) => {
                if (touchId === null) return;
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === touchId) {
                        touchId = null;
                        knob.style.transform = 'translate(0px, 0px)';
                        inputVector.x = 0;
                        inputVector.y = 0;
                        break;
                    }
                }
            };

            window.addEventListener('touchend', endTouch, { passive: true });
            window.addEventListener('touchcancel', endTouch, { passive: true });
            
            // Fire Handling
            fireBtn.addEventListener('touchstart', (e) => {
                isFiringRequested = true;
                initAudio();
            }, { passive: true });

            fireBtn.addEventListener('touchend', () => { isFiringRequested = false; }, { passive: true });

            // Universal Desktop Fallback Keymaps
            window.addEventListener('keydown', (e) => {
                if(e.key === 'w' || e.key === 'ArrowUp') inputVector.y = 1;
                if(e.key === 's' || e.key === 'ArrowDown') inputVector.y = -1;
                if(e.key === 'a' || e.key === 'ArrowLeft') inputVector.x = -1;
                if(e.key === 'd' || e.key === 'ArrowRight') inputVector.x = 1;
                if(e.key === ' ') { isFiringRequested = true; initAudio(); }
            });
            window.addEventListener('keyup', (e) => {
                if(['w', 's', 'ArrowUp', 'ArrowDown'].includes(e.key)) inputVector.y = 0;
                if(['a', 'd', 'ArrowLeft', 'ArrowRight'].includes(e.key)) inputVector.x = 0;
                if(e.key === ' ') isFiringRequested = false;
            });
        }

        function onWindowResize() {
            if(!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- GAME SYSTEM PERFORMANCE RUNTIME MATRIX TICKER ---
        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();
            const deltaTime = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;

            // 1. Process Translation Transform Physics Loop
            if (inputVector.x !== 0 || inputVector.y !== 0) {
                player.rotation.y -= inputVector.x * CONFIG.turnSpeed * deltaTime;
                moveVector.set(0, 0, inputVector.y);
                moveVector.applyQuaternion(player.quaternion);
                player.position.addScaledVector(moveVector, CONFIG.playerSpeed * deltaTime);

                const halfArena = CONFIG.arenaSize / 2;
                player.position.x = Math.max(-halfArena, Math.min(halfArena, player.position.x));
                player.position.z = Math.max(-halfArena, Math.min(halfArena, player.position.z));
            }

            // 2. Weapon Processing Core
            if (fireCooldownTimer > 0) {
                fireCooldownTimer -= deltaTime;
            }
            if (isFiringRequested && fireCooldownTimer <= 0) {
                fireWeapon();
                fireCooldownTimer = CONFIG.fireRate;
            }

            // 3. Render Matrix Updates for Lasers
            let matrixNeedsUpdate = false;
            for (let i = 0; i < CONFIG.maxProjectiles; i++) {
                const p = projectileData[i];
                if (p.active) {
                    p.life -= deltaTime;
                    if (p.life <= 0) {
                        p.active = false;
                        tempObject3D.position.set(0, -500, 0);
                    } else {
                        p.position.addScaledVector(p.direction, CONFIG.projectileSpeed * deltaTime);
                        tempObject3D.position.copy(p.position);
                        tempObject3D.lookAt(p.position.clone().add(p.direction));
                        tempObject3D.rotateX(Math.PI / 2);
                    }
                    tempObject3D.updateMatrix();
                    projectileMesh.setMatrixAt(i, tempObject3D.matrix);
                    matrixNeedsUpdate = true;
                }
            }
            if (matrixNeedsUpdate) {
                projectileMesh.instanceMatrix.needsUpdate = true;
            }

            // 4. Draw Call Execution
            renderer.render(scene, camera);

            // 5. Diagnostics Overlay Data
            frameCount++;
            fpsTimer += deltaTime;
            if (fpsTimer >= 1.0) {
                document.getElementById('perf-monitor').innerText = 
                    `FPS: ${frameCount} | DC: ${renderer.info.render.calls}`;
                frameCount = 0;
                fpsTimer = 0;
            }
        }

        // Direct absolute execution invocation bypassing volatile event hooks
        init();
    </script>
</body>
</html>
